# This is the upstream-owned validation unit called by the thin workflow
# emitted into adopter repositories. It runs in the caller's repository and
# event context; only the runner and the demonstrated clue acquisition choices
# are inputs. Keep the action reference immutable and keep the job name stable.
name: Cliewen validation

on:
  workflow_call:
    inputs:
      runner:
        description: JSON array of GitHub-hosted or self-hosted runner labels
        required: false
        type: string
        default: '["ubuntu-latest"]'
      clue-version:
        description: Bare clue release version whose binary or release asset is used
        required: true
        type: string
      clue-source:
        description: vendored for a checked-in binary or release for a downloaded binary
        required: false
        type: string
        default: vendored
      clue-install-directory:
        description: Writable directory for the verified clue executable; empty uses RUNNER_TEMP
        required: false
        type: string
        default: ''
      # Fail-closed by design. The draft relaxation below is only safe when the
      # caller also triggers on `ready_for_review`: without that trigger no run
      # fires when a draft becomes a candidate, and the lenient result from the
      # draft would stand as the required check on a mergeable pull request.
      # The trigger lives in the adopter-owned caller (ADR-038), so the caller
      # is what declares support. An adopter that bumps only the workflow
      # reference keeps today's strict behaviour rather than a silent hole.
      draft-aware:
        description: Caller triggers on ready_for_review, so drafts may skip the digest and acceptance-brief gates
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ${{ fromJSON(inputs.runner) }}
    env:
      CLUE_VERSION: ${{ inputs.clue-version }}
      CLUE_SOURCE: ${{ inputs.clue-source }}
      CLUE_INSTALL_DIRECTORY: ${{ inputs.clue-install-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect Cliewen change
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files"; then
            echo "cliewen=true" >> "$GITHUB_OUTPUT"
            echo "full=true" >> "$GITHUB_OUTPUT"
          elif [ ! -s "$RUNNER_TEMP/changed-files" ]; then
            echo "cliewen=true" >> "$GITHUB_OUTPUT"
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            if grep -Eqv '\.md$' "$RUNNER_TEMP/changed-files" || grep -Eq '^(docs/|changes/|\.agents/|\.claude/|\.github/|AGENTS\.md$|CHANGELOG\.md$|CONTRIBUTING\.md$|SECURITY\.md$|CODE_OF_CONDUCT\.md$)' "$RUNNER_TEMP/changed-files"; then
              echo "cliewen=true" >> "$GITHUB_OUTPUT"
            else
              echo "cliewen=false" >> "$GITHUB_OUTPUT"
            fi

            proposal=false
            if git log --format= --name-only "$BASE_SHA..$GITHUB_SHA" -- changes | grep -Eq '^changes/CH-[^/]+/proposal\.md$'; then
              proposal=true
            fi
            message="$(git log -1 --format=%B "$HEAD_SHA")"
            override=false
            if printf '%s\n' "$message" | grep -Eiq '^Cliewen-Route:[[:space:]]*simple[[:space:]]*$' && \
               printf '%s\n' "$message" | grep -Eiq '^Cliewen-Recommendation:[[:space:]]*full[[:space:]]*$' && \
               printf '%s\n' "$message" | grep -Eiq '^Cliewen-Override:[[:space:]]*[^[:space:]].+$'; then
              override=true
            fi
            if [ "$proposal" = true ] && [ "$override" = false ]; then
              echo "full=true" >> "$GITHUB_OUTPUT"
              echo "cliewen=true" >> "$GITHUB_OUTPUT"
            else
              echo "full=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Validate clue source choice
        if: steps.scope.outputs.cliewen == 'true'
        run: |
          case "$CLUE_SOURCE" in
            vendored|release) ;;
            *) echo "::error title=Unsupported clue source::Use clue-source=vendored or clue-source=release"; exit 1 ;;
          esac

      - name: Check whether the wall is armed
        if: steps.scope.outputs.cliewen == 'true' && inputs.clue-source == 'vendored'
        id: armed
        run: |
          if [ -f ".github/tools/clue-${CLUE_VERSION}-linux-amd64" ] && [ -f ".github/tools/SHA256SUMS" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Corpus wall not armed::No matching vendored clue and SHA256SUMS were found under .github/tools/ — corpus validation was SKIPPED. Arm it with the release asset for v${CLUE_VERSION}, or set clue-source to release."
          fi

      - name: Acquire and verify clue
        if: steps.scope.outputs.cliewen == 'true' && (inputs.clue-source == 'release' || steps.armed.outputs.armed == 'true')
        id: clue
        run: |
          set -eu
          install_dir="${CLUE_INSTALL_DIRECTORY:-${RUNNER_TEMP}/clue}"
          mkdir -p "$install_dir"
          binary="clue-${CLUE_VERSION}-linux-amd64"

          # Verify exactly the binary about to be executed. `sha256sum -c
          # --ignore-missing` is the wrong tool here: it checks the listed
          # files that are present and says nothing about a file that is
          # present but unlisted, so a binary SHA256SUMS never mentioned
          # would run unverified whenever any other listed asset happens to
          # sit beside it. Selecting the entry by name first turns "not
          # listed" into a failure and makes the extra archive lines inert
          # by construction rather than by a flag.
          verify_one() {
            dir="$1"
            file="$2"
            entry="$(awk -v want="$file" '
              { name = $2; sub(/^\*/, "", name); if (name == want) { print; found++ } }
              END { exit(found == 1 ? 0 : 1) }
            ' "$dir/SHA256SUMS")" || {
              echo "::error title=Checksum entry missing::$dir/SHA256SUMS does not list exactly one entry for $file — the vendored or downloaded pair does not belong to the same release"
              exit 1
            }
            printf '%s\n' "$entry" | (cd "$dir" && sha256sum -c --strict -)
          }

          case "$CLUE_SOURCE" in
            vendored)
              verify_one .github/tools "$binary"
              cp ".github/tools/$binary" "$install_dir/clue"
              ;;
            release)
              # --proto '=https' --tlsv1.2 confine both the request and every
              # redirect --location follows; the release host is not ours to
              # vouch for beyond the protocol it must stay on.
              curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error "https://github.com/cliewen/cliewen/releases/download/v${CLUE_VERSION}/${binary}" --output "$install_dir/$binary"
              curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error "https://github.com/cliewen/cliewen/releases/download/v${CLUE_VERSION}/SHA256SUMS" --output "$install_dir/SHA256SUMS"
              verify_one "$install_dir" "$binary"
              cp "$install_dir/$binary" "$install_dir/clue"
              ;;
          esac
          chmod 0755 "$install_dir/clue"
          echo "path=$install_dir/clue" >> "$GITHUB_OUTPUT"
          "$install_dir/clue" version

      # --forbid-changes is the digest-before-merge gate: main (and any PR
      # at merge time) must not contain the transient /changes tree. A draft
      # legitimately carries its workspace, so it is validated without the
      # flag; the forge cannot merge a draft, and ready_for_review reruns the
      # strict form on the same head, so the merge gate is unchanged (PDR-040).
      - name: clue validate --forbid-changes
        if: steps.scope.outputs.cliewen == 'true' && (inputs.clue-source == 'release' || steps.armed.outputs.armed == 'true')
        env:
          CLUE_PATH: ${{ steps.clue.outputs.path }}
          RELAX: ${{ inputs.draft-aware && github.event.pull_request.draft }}
        run: |
          if [ "$RELAX" = "true" ]; then
            "$CLUE_PATH" validate
          else
            "$CLUE_PATH" validate --forbid-changes
          fi

      # A draft is not a candidate and has no brief yet; the requirement binds
      # when the pull request is marked ready (PDR-040). Skipped only for a
      # draft-aware caller, for the reason given on that input.
      - name: Require a completed acceptance brief
        if: github.event_name == 'pull_request' && !(inputs.draft-aware && github.event.pull_request.draft) && steps.scope.outputs.full == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" | grep -Fq '## Acceptance brief' || { echo 'FAIL: full-loop PRs need an acceptance brief'; exit 1; }
          ! printf '%s' "$PR_BODY" | grep -Fq '<!-- REQUIRED' || { echo 'FAIL: replace every acceptance-brief REQUIRED placeholder'; exit 1; }

      # Branch protection is a host setting no file records, so `clue validate`
      # cannot see it (ADR-044). This step asks GitHub instead and only ever
      # reports: the configuration is the maintainer's, so the step never
      # changes the job's result (PDR-060). The rules endpoint is readable with
      # `contents: read`; classic branch protection and ruleset bypass lists are
      # not, so the notice names the unseen bypass list and the warning names
      # unseen classic protection rather than implying an answer for either.
      # Regex matching stays inside bash, because GitHub runs this with
      # pipefail and `grep -q` closing a pipe early would fail the step.
      - name: Report whether the merge boundary is enforced
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"
          checklist="See .github/cliewen-wall.md or https://cliewen.dev/ci-wall for how to configure it."
          error_file="$RUNNER_TEMP/merge-boundary-error"
          if ! rules="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/rules/branches/$branch" 2>"$error_file")"; then
            reason="$(tr '\r\n' '  ' < "$error_file")"
            echo "::warning title=Merge boundary unknown::Could not ask GitHub what $branch enforces ($reason). Nothing was observed, so this is not a pass. $checklist"
            exit 0
          fi
          flat="${rules//[[:space:]]/}"
          if [ "${flat:0:1}" != "[" ]; then
            echo "::warning title=Merge boundary unknown::GitHub did not return a rule list for $branch, so nothing was observed and this is not a pass. $checklist"
            exit 0
          fi
          missing=""
          require() {
            if ! [[ $flat =~ $1 ]]; then
              missing="${missing:+$missing; }$2"
            fi
          }
          require '"type":"deletion"' 'branch deletion blocked'
          require '"type":"non_fast_forward"' 'force pushes blocked'
          require '"type":"pull_request"' 'pull requests required'
          require '"allowed_merge_methods":\["merge"\]' 'merge commits as the only merge method'
          require '"required_review_thread_resolution":true' 'review conversations resolved before merge'
          require '"context":"validate(/validate)?"' 'the validate check required'
          if [ -z "$missing" ]; then
            echo "::notice title=Merge boundary observed::GitHub reports that $branch blocks deletion and force pushes, requires pull requests merged only by merge commit with conversations resolved, and requires the validate check. The bypass list is not visible to this workflow's token, so confirm it is empty."
          else
            echo "::warning title=Merge boundary not enforced::GitHub reports no active rule on $branch for: $missing. Until these are in place, nothing at the host stops a change reaching $branch without them. Classic branch protection is not visible to this workflow's token; if you use it instead of rulesets, confirm it covers the same. $checklist"
          fi
