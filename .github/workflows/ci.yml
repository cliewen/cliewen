# The wall (Foundation §2): the same clue binary that runs locally
# judges every PR and every push to main. Job name `validate` is the
# required status check once branch protection is enabled.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Classify changed surface
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git diff --name-only -z "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files"; then
            echo "diffok=true" >> "$GITHUB_OUTPUT"
            git log --format= --name-only -z "$BASE_SHA..$GITHUB_SHA" -- changes > "$RUNNER_TEMP/history-files"
            git log -1 --format=%B "$HEAD_SHA" > "$RUNNER_TEMP/head-message"
            node .github/scripts/ci-scope.mjs "$RUNNER_TEMP/history-files" "$RUNNER_TEMP/head-message" < "$RUNNER_TEMP/changed-files" >> "$GITHUB_OUTPUT"
          else
            echo "diffok=false" >> "$GITHUB_OUTPUT"
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "corpus=true" >> "$GITHUB_OUTPUT"
            echo "guide=true" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "override=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Test CI scope classifier
        run: npm run test:ci-scope
      - name: Test this repository's release workflow
        run: npm run test:release-workflow
      # A draft is not a candidate: it legitimately has no brief yet. GitHub
      # cannot merge a draft, and ready_for_review reruns this job on the same
      # head, so the merge gate is unchanged (PDR-040).
      - name: Require a completed acceptance brief
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && steps.scope.outputs.full == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" | grep -Fq '## Acceptance brief' || { echo 'FAIL: full Cliewen PRs need an acceptance brief'; exit 1; }
          ! printf '%s' "$PR_BODY" | grep -Fq '<!-- REQUIRED' || { echo 'FAIL: replace every acceptance-brief REQUIRED placeholder'; exit 1; }
      - uses: actions/setup-go@v7
        if: steps.scope.outputs.go == 'true' || steps.scope.outputs.corpus == 'true' || steps.scope.outputs.guide == 'true'
        with:
          go-version: stable
      - name: Test guide evidence
        if: steps.scope.outputs.guide == 'true' && steps.scope.outputs.go != 'true'
        run: go test ./guide
      - name: Build
        if: steps.scope.outputs.go == 'true'
        run: go build ./...
      - name: Test (with coverage)
        if: steps.scope.outputs.go == 'true'
        run: go test ./... -coverprofile=coverage.out
      - name: Coverage gate (C-014, total >= 80%)
        if: steps.scope.outputs.go == 'true'
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "total statement coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit !(t >= 80) }' || { echo "FAIL: ${total}% is below the 80% gate (C-014)"; exit 1; }
      - name: Build public guide (strict dead-link check)
        if: steps.scope.outputs.guide == 'true'
        run: |
          npm ci
          npm run guide:build
      # The digest gate binds where merging is possible: on a ready PR and on
      # main. A draft legitimately carries its /changes workspace, so it gets
      # the same validation without --forbid-changes; GitHub cannot merge a
      # draft, and marking it ready reruns the strict form on the same head,
      # so nothing reaches the merge boundary ungated (PDR-040).
      - name: Validate corpus (digest-before-merge gate)
        if: steps.scope.outputs.corpus == 'true'
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$DRAFT" = "true" ]; then
            go run ./cmd/clue validate
          else
            go run ./cmd/clue validate --forbid-changes
          fi
      # Runs for every scope, plain or full — whitespace hygiene is not a
      # Cliewen concern. Gated on diffok so it shares the classifier's
      # fail-closed path: when the base diff is unresolvable the classifier
      # already forced the full pipeline, and there is no valid range to check.
      - name: Check diff whitespace
        if: steps.scope.outputs.diffok == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA" "$GITHUB_SHA"
      # C-008's machine. Shares the classifier's fail-closed gating for the
      # same reason the whitespace check does: with no resolvable base there is
      # no "before" to compare a plan against, and inventing one would either
      # pass everything or fail everything.
      - name: Completed plans stay frozen (C-008)
        if: steps.scope.outputs.diffok == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: .github/scripts/completed-plans.sh "$BASE_SHA" "$GITHUB_SHA"
      # The release gates, run while the release is still a proposal. They are
      # a no-op for every change that does not raise the version stamp.
      #
      # This is the check that was missing. The gates ran only after the merge,
      # and tagging fires only on the merge that raises the stamp — so a
      # release PR that could never be tagged still looked mergeable, and the
      # failure arrived when the version was already committed and could no
      # longer be retried. That cost 0.11.1.
      #
      # tag-on-merge remains the authority: if the base is unresolvable this
      # step is skipped and the merge-time run is still there, which is exactly
      # today's behaviour rather than a weaker one.
      - name: Release gates
        if: steps.scope.outputs.diffok == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: .github/scripts/release-gates.sh "$BASE_SHA" "$GITHUB_SHA"
