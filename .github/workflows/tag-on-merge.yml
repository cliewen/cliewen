# A human merge authorizes release publication (PDR-015). A release is short
# administrative work: no CH workspace, digest, or acceptance brief is needed.
# An unpublished tag may be retargeted to a repaired main commit; any GitHub
# Release object makes its version immutable.
name: Tag on merge

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

# Hold the lock until the dispatched release completes. A repair cannot retag
# while an earlier build still has a path to publishing the old commit.
concurrency:
  group: tag-on-main
  queue: max
  cancel-in-progress: false

jobs:
  tag:
    name: Tag or recover a version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the version from the skill stamp
        id: version
        run: |
          tmpl=internal/skills/source/shared/frontmatter.md.tmpl
          v=$(sed -n 's/^version:[[:space:]]*//p' "$tmpl" | head -n 1)
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error title=Unreadable version stamp::${tmpl} does not carry a bare semver version; got '${v}'" >&2
            exit 1
          fi
          echo "v=${v}" >> "$GITHUB_OUTPUT"

      - name: Check whether this merge needs publication
        id: check
        env:
          VERSION: ${{ steps.version.outputs.v }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tmpl=internal/skills/source/shared/frontmatter.md.tmpl
          tag="v${VERSION}"
          if gh release view "$tag" --json id >/dev/null 2>&1; then
            echo "$tag already has a GitHub Release — its tag is immutable."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is unpublished — retargeting it to this repaired main commit."
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "retag=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "${GITHUB_SHA}^" "${GITHUB_SHA}" -- "$tmpl"; then
            echo "The version stamp did not change and no unpublished tag needs recovery."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$tag is a new release."
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "retag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the release gates
        if: steps.check.outputs.release == 'true'
        run: .github/scripts/release-gates.sh "${GITHUB_SHA}^" "${GITHUB_SHA}" --release

      - name: Tag the merge commit
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.v }}
          RETAG: ${{ steps.check.outputs.retag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$RETAG" = "true" ]; then
            git tag -fa "v${VERSION}" -m "v${VERSION} (rebuild before publication)"
            git push --force origin "refs/tags/v${VERSION}"
          else
            git tag -a "v${VERSION}" -m "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      # Tags pushed with GITHUB_TOKEN do not trigger workflows. Dispatching is
      # the documented exception; waiting preserves the critical section.
      - name: Start and wait for the release
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.v }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml --ref "v${VERSION}"
          for attempt in $(seq 1 30); do
            run_id=$(gh run list --workflow release.yml --branch "v${VERSION}" --event workflow_dispatch --json databaseId,headSha --jq '.[] | select(.headSha == "'"$GITHUB_SHA"'") | .databaseId' --limit 20 | head -n 1)
            if [ -n "$run_id" ]; then
              gh run watch "$run_id" --exit-status
              exit $?
            fi
            sleep 2
          done
          echo "Could not find the dispatched release run for v${VERSION}." >&2
          exit 1
