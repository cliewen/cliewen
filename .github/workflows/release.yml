# clue ships (P-002/M-004, P-007/M-030): a `vX.Y.Z` tag builds cross-platform
# binaries, each stamped with the tag's version via ldflags, and publishes
# them as a GitHub release for `gh release download`. The stamped string is
# bare semver (the leading `v` is stripped, ADR-011) so it can be compared
# with the skills' frontmatter version; the gate below performs that
# comparison rather than assuming it holds.
#
# The build matrix, the asset names, and the checksum file live in
# .goreleaser.yaml (ADR-030) — that file, not this one, is where a release's
# published interface is defined, and the sanity tests judge it there.
#
# workflow_dispatch is allowed only against a tag ref (re-running a release):
# the guard below rejects any non-tag ref, so dispatching from a branch can
# never stamp binaries as the branch name or publish a branch-named release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    steps:
      # GoReleaser derives the version from the tag and refuses a shallow
      # clone; nothing below this line can run without full history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Require a version tag
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || ! printf '%s' "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Release must run from a vX.Y.Z tag; got ref_type='${GITHUB_REF_TYPE}' ref_name='${GITHUB_REF_NAME}'" >&2
            exit 1
          fi

      - name: Determine version
        id: version
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The release body is this version's CHANGELOG.md section, extracted
      # verbatim (ADR-012): a release cannot ship without user-facing notes,
      # and the published page can never drift from the reviewed file.
      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.v }}
        run: |
          awk -v ver="$VERSION" '
            BEGIN { header = "## [" ver "]" }
            !found { if (index($0, header) == 1) found = 1; next }
            /^## \[/ { exit }
            { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no '## [${VERSION}]' section with content; write user-facing notes before tagging (ADR-012)" >&2
            exit 1
          fi

      # A release has two version inputs — the tag and the skills' own
      # frontmatter stamp — and ADR-011 makes their disagreement a failure.
      # Run the judge stamped exactly as the published binary will be, so
      # the drift rule an adopter runs is applied here, where the mismatch
      # can still be prevented, instead of surfacing in their repository
      # with no local change to explain it. --forbid-changes keeps an
      # undigested workspace out of a release the way CI keeps it off main.
      - name: Require the shipped skills to match the tag
        env:
          VERSION: ${{ steps.version.outputs.v }}
        run: go run -ldflags "-X main.version=${VERSION}" ./cmd/clue validate --forbid-changes

      # A tag can land on any commit; nothing ships untested.
      - name: Run tests
        run: go test ./...

      # Builds every target, writes SHA256SUMS, and publishes the release —
      # all from .goreleaser.yaml, so the asset names an adopter's CI wall
      # and the published install scripts depend on have one definition.
      # --release-notes keeps the body the reviewed CHANGELOG section
      # (ADR-012), overriding goreleaser's own generator, which the config
      # also disables. Pinned by commit SHA: this third-party action runs
      # with contents: write and publishes the artifacts.
      #
      # goreleaser refuses to build from a dirty tree, and the extracted
      # release-notes.md would count as dirty — .gitignore covers it.
      - name: Build and publish with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Exact, not a range: this step publishes with contents: write and
          # renders the asset names ADR-030 makes a public contract. A
          # floating range could change either without a change here.
          # Bumping it is a deliberate act that reruns the release dry run.
          version: "2.17.1"
          args: release --clean --release-notes=release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
