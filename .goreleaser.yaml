# clue ships (CAP-004, ADR-030): one `vX.Y.Z` tag produces the bare
# versioned binaries every adopted repository already downloads by name,
# plus archives a future package-manager channel can consume — all covered
# by a single SHA256SUMS.
#
# The `bare` archive's name_template is a PUBLIC CONTRACT, not an
# implementation detail. Every repository that has run `clue init` carries
# .github/workflows/clue.yml, a thin caller for the upstream validation
# workflow (ADR-038); that workflow resolves `clue-<version>-linux-amd64` by
# name — vendored under .github/tools/ or downloaded from the release —
# verifies it against SHA256SUMS, and stages it in a writable directory.
# Renaming these assets breaks all of them at their next CI run, with no
# change in those repositories to explain it. Assets are append-only: a new
# channel may add, never rename.
# TestSanity_ReleaseKeepsTheAssetNamesTheAdopterWallInstalls holds this.
version: 2

project_name: clue

builds:
  - id: clue
    main: ./cmd/clue
    binary: clue
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Bare semver, `v` already stripped by goreleaser — the form ADR-011
    # requires so the drift rule can compare the binary against the skills'
    # frontmatter stamp with a string equality.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # The binary embeds the commit's timestamp, not the runner's clock, so
    # re-running a tag reproduces the same bytes.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  # The compatibility surface: the same six assets the hand-rolled build
  # loop published, under the same six names. goreleaser carries the .exe
  # extension into the Windows asset name, so those two are unchanged too.
  - id: bare
    ids: [clue]
    formats: [binary]
    name_template: "clue-{{ .Version }}-{{ .Os }}-{{ .Arch }}"

  # For a future package-manager channel: Homebrew would want a tarball and
  # winget a zip, and neither installs a bare binary from a release asset.
  # Published now so adding one later changes no existing asset (ADR-030).
  - id: bundle
    ids: [clue]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "clue_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: false
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  algorithm: sha256
  # The upstream validation workflow selects this file's entry for the
  # binary it is about to execute, by that exact upload name, and fails
  # when there is no such entry. Not renameable. Selecting one entry is
  # also why adding the archives above breaks nothing: the checksum file
  # lists every upload name, and the lines it does not select are inert.
  name_template: "SHA256SUMS"

# There is deliberately no `changelog:` block here.
#
# The release body is the tag's CHANGELOG.md section, passed by the
# workflow as --release-notes (ADR-012). Supplying that flag already skips
# GoReleaser's own generator — the commit dump with @mentions that ADR-012
# refuses — so nothing further is needed to keep it out.
#
# `changelog: {disable: true}` looks like the stronger belt-and-braces
# version of the same intent and is the exact opposite: it is documented to
# "also ignore any changelog files passed via --release-notes, and render
# an empty changelog". It shipped v0.8.0 with a blank release page. The
# guard that catches this now is the workflow's post-publish comparison of
# the published body against release-notes.md, because no amount of config
# reading can tell you what GitHub ended up displaying.

release:
  github:
    owner: cliewen
    name: cliewen
  name_template: "{{ .Tag }}"
  draft: false
  prerelease: auto

# No package-manager publisher yet, deliberately (ADR-030). Homebrew
# formulas are deprecated upstream, and their replacement — casks — is
# macOS-only, so Homebrew can no longer serve macOS and Linux from one
# channel. The install scripts under guide/public/ cover all three
# platforms today; winget and a Homebrew cask are additive and follow.
