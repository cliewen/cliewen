# The demonstrated enterprise shape (AN-014): approved self-hosted labels, the
# release source instead of a committed binary, and a writable staging path
# that needs no root and lies outside the checkout.
name: clue

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: validate
    uses: cliewen/cliewen/.github/workflows/clue-validation.yml@cccccccccccccccccccccccccccccccccccccccc
    with:
      runner: '["self-hosted","linux","x64","approved"]'
      clue-version: 0.10.0
      clue-source: release
      clue-install-directory: /opt/cliewen-runner/bin
      draft-aware: true
